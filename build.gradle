plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	maven {
		name = 'Polyfrost'
		url = 'https://repo.polyfrost.org/releases'
		content {
			includeGroup 'org.polyfrost.oneconfig'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dglab" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "dglab-gametest"
		enableGameTests = false
		enableClientGameTests = true
		// The multiplayer game test starts a local dedicated server, which only runs once the Minecraft EULA is accepted.
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Draws the pairing QR code. It is bundled into the mod jar.
	implementation "io.nayuki:qrcodegen:${project.qrcodegen_version}"
	include "io.nayuki:qrcodegen:${project.qrcodegen_version}"

	// Mod Menu is optional: compile against it, and load it only in the development client.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// OneConfig is optional too. Only its small API artifacts are compiled against; the game tests use them as well.
	["config", "config-impl"].each { module ->
		clientCompileOnly("org.polyfrost.oneconfig:${module}:${project.oneconfig_version}") { transitive = false }
		gametestCompileOnly("org.polyfrost.oneconfig:${module}:${project.oneconfig_version}") { transitive = false }
	}
	clientCompileOnly("org.polyfrost.oneconfig:mod-toggles:${project.oneconfig_mod_toggles_version}") { transitive = false }
	// The game tests open OneConfig's screen to take screenshots of it.
	gametestCompileOnly("org.polyfrost.oneconfig:ui:${project.oneconfig_version}") { transitive = false }
	// The development client and the game tests run with OneConfig, unless -Pdglab.oneconfig=false leaves it out
	// to check that the mod works without it.
	if (providers.gradleProperty("dglab.oneconfig").getOrElse("true").toBoolean()) {
		localRuntime("maven.modrinth:oneconfig:${project.oneconfig_modrinth_version}") { transitive = false }
		localRuntime("maven.modrinth:polycompose:${project.polycompose_modrinth_version}") { transitive = false }
		localRuntime("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}") { transitive = false }
	}

	// Decodes the pairing QR code in the game tests. It is not shipped.
	gametestImplementation "com.google.zxing:core:${project.zxing_version}"
}

def javaVersion = project.java_version as int

// Values from gradle.properties that are substituted into resource files.
def resourceProperties = [
	version: project.version,
	minecraft_version: project.minecraft_version,
	loader_version: project.loader_version,
	fabric_api_version: project.fabric_api_version,
	java_version: project.java_version,
]

processResources {
	inputs.properties resourceProperties

	filesMatching("fabric.mod.json") {
		expand resourceProperties
	}
}

processClientResources {
	inputs.properties resourceProperties

	filesMatching("*.mixins.json") {
		expand resourceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
