# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4

# Java version used to compile the mod and required at runtime.
java_version=25

# Mod Properties
# The published version is "<mod_version>+<minecraft_version>".
mod_version=1.0.0
group=com.urntt

# Dependencies
fabric_api_version=0.166.2+26.3
modmenu_version=21.0.1
# OneConfig is optional: its API is compiled against, and the mod and what it needs run only in development.
oneconfig_version=1.9.5
oneconfig_mod_toggles_version=1.0.0
# Modrinth version IDs of the Fabric 26.3 builds, because their version numbers are shared with other platforms:
# OneConfig 1.9.5 and PolyCompose 3.0.9.
oneconfig_modrinth_version=357SDtoK
polycompose_modrinth_version=r5o1dNbo
fabric_kotlin_version=1.14.2+kotlin.2.4.21
# Bundled into the mod jar.
qrcodegen_version=1.8.0
# Used only by the game tests.
zxing_version=3.5.4
